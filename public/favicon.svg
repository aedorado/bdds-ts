<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcd34d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" />

  <!-- Inner decorative circle -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="white" stroke-width="2" opacity="0.2" />

  <!-- Main "D" letter -->
  <text
    x="100"
    y="130"
    font-family="Georgia, serif"
    font-size="110"
    font-weight="700"
    text-anchor="middle"
    fill="url(#textGradient)"
    filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))"
  >D</text>

  <!-- Small decorative element - representing transcripts -->
  <g opacity="0.6" transform="translate(130, 65)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="6" x2="20" y2="6" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="12" x2="22" y2="12" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
