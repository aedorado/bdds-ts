name: AI Generation Pipeline

on:
  schedule:
    # Run every 1 hour
    - cron: '* */2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  process-lectures:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      NODE_ENV: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI generation for next lecture
        run: npx tsx scripts/ai/process-next-lecture.ts
        continue-on-error: true

      - name: Log completion
        run: echo "AI generation cycle completed at $(date)"
